<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>T24 OFS Messages</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="description" content="Generate T24 OFS Messages. Create OFS Transaction Request and Enquiry Request messages.">
		<meta name="theme-color" content="#20252b">
		<link rel="manifest" href="./manifest.json">
		<link href="./css/foundation.min.css" rel="stylesheet" />
		<script src="./js/vue.min.js"></script>
		<style>
			:root{--ink:#20252b;--paper:#f4f1eb;--panel:#fffdf9;--line:#d9d1c5;--accent:#e05d44;--accent-dark:#b74431;--muted:#6b6f72;}
			body{background:var(--paper);color:var(--ink);font-family:Georgia,serif;font-weight:400;}
			h1,h2,h3,h4,h5,h6{font-family:Arial,sans-serif;font-weight:700;letter-spacing:.02em;}
			.top-bar{background:var(--ink);border-bottom:4px solid var(--accent);box-shadow:0 4px 16px rgba(32,37,43,.18);}
			.top-bar .menu{background:transparent;}
			.top-bar .menu a{display:block;color:#f7f2e9;font-family:Arial,sans-serif;font-weight:700;}
			.top-bar .menu a:hover{background:#343c43;color:#fff;}
			.top-bar .menu a.active{background:var(--accent);color:#fff;}
			.callout{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(32,37,43,.06);}
			.button{background:var(--accent);border-radius:4px;font-family:Arial,sans-serif;font-weight:700;}
			.button:hover,.button:focus{background:var(--accent-dark);}
			.button.secondary{background:#ddd6cc;color:var(--ink);}
			.button.secondary:hover,.button.secondary:focus{background:#c8c0b5;}
			input,select,textarea{border-color:var(--line);border-radius:3px;background:#fffefa;}
			input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(224,93,68,.15);}
			.iserr{color:#b42318;font-weight:bold;}
			#clipContent{border:2px solid var(--line);}
			#clipContent.highlight{border-color:var(--accent);}
			.required{color:var(--accent-dark);}
			.help-text{color:var(--muted);}
		</style>
	</head>
	<body>
		<div id="app">
			<div class="row">
				<div class="top-bar">
					<div class="top-bar-left">
						<ul class="menu">
							<li><a class="active">Reverse OFS Viewer</a></li>
						</ul>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="columns small-12">
					<div v-if="loaded">
						<reverse-ofs></reverse-ofs>
					</div>
					<div v-else>
						<div class="text-center" style="font-size:3em;padding:100px;">
							<p>Loading <i class="fa fa-spinner fa-spin"></i></p>
						</div>
					</div>	
				</div>
			</div><!--/.row-->

			<template id="automsgsTemplate">
				<div class="row">
					<div class="columns small-12">
						<div class="callout">

							<ul class="menu">
								<li v-bind:class="{'active':pageTransaction}"><a href="#" v-on:click.stop="setPageTransaction">Transaction Request</a></li>
								<li v-bind:class="{'active':pageEnquiry}"><a href="#" v-on:click.stop="setPageEnquiry">Enquiry Request</a></li>
								<li class="menu-text" style="text-transform:uppercase">Generate OFS Messages</li>
							</ul>
							<br/>

							<form v-on:submit.prevent>
								<div v-if="pageTransaction">
									<div class="row">
										<div class="columns small-12 medium-4">
											<label>Application <span class="required">*</span>
												<input type="text" v-model="t24app" placeholder="ACCOUNT" />
											</label>
										</div>
										<div class="columns small-12 medium-3">
											<label>Version
												<input type="text" v-model="t24vers" placeholder="P1" />
											</label>
										</div>
										<div class="columns small-12 medium-3">
											<label>Function
												<input type="text" v-model="t24func" placeholder="I" />
											</label>
										</div>
										<div class="columns small-12 medium-2">
											<label>No. of Auth
												<input type="number" v-model="t24auth" />
											</label>
										</div>

									</div><!--/.row-->

									<div class="row">
										<div class="columns small-12 medium-4">
											<div class="row">
												<div class="columns small-12 medium-6">
													<p>Process or Validate <span class="help-text">(optional)</span>
														<label><input type="radio" v-model="t24process"  name="t24process" value="PROCESS"/>Process</label>
														<label><input type="radio" v-model="t24process"  name="t24process" value="VALIDATE"/>Validate</label>
													</p>
												</div>
												<div class="columns small-12 medium-4 end">
													GTS Control <span class="help-text">(optional)</span>
													<select v-model="t24gts">
														<option selected="selected"></option>
														<option >1</option>
														<option >2</option>
														<option >3</option>
														<option >4</option>
													</select>
												</div>
											</div><!--/.row-->
										</div>
										<div class="columns small-12 medium-8">
											<div class="row">
												<div class="columns small-12 medium-4">
													<label>Username <span class="required">*</span>
														<input type="text" v-model="t24user" placeholder="INPUTT" />
													</label>
												</div>
												<div class="columns small-12 medium-4">
													<label>Password <span class="required">*</span>
														<input type="text" v-model="t24pass" placeholder="123456" />
													</label>
												</div>
												<div class="columns small-12 medium-4">
													<label>Company <span class="help-text">(optional)</span>
														<input type="text" v-model="t24company" />
													</label>
												</div>
											</div><!--/.row-->
											<div class="row">
												<div class="columns small-12 text-right">
													<span style="margin-right: 20px;">Use replacement characters: 
														<input type="radio" v-model="t24replacementChar" name="t24replacementChar" value="NO" checked/><label>No </label>
														<input type="radio" v-model="t24replacementChar" name="t24replacementChar" value="YES"/><label>Yes</label>
													</span>
													<span>Replace existing record: 
														<input type="radio" v-model="t24replace" name="t24replace" value="NO" checked/><label>No </label>
														<input type="radio" v-model="t24replace" name="t24replace" value="YES"/><label>Yes</label>
													</span>
												</div>
											</div><!--/.row-->
										</div>
									</div><!--/.row-->


									<div class="row">
										<div class="columns small-12 medium-3">
											<label>Transaction ID <span class="help-text">(optional)</span>
												<br/>
												<input type="text" v-model="t24msgid" />
											</label>
										</div>
										<div class="columns small-12 medium-9">
											<label>Message Data <span class="help-text">(optional - comma separated values)</span>
												<textarea v-model="t24msgdata" rows=2 placeholder="CUSTOMER=100724,CATEGORY=1001,CURRENCY=USD"></textarea>
											</label>
										</div>
									</div><!--/.row-->
								</div><!--/. /v-if-->

								<div v-else>

									<input type="hidden" v-model="t24app" placeholder="ENQUIRY.SELECT" />


									<div class="row">
										<div class="columns small-12 medium-4">
											<label>Username
												<input type="text" v-model="t24user" placeholder="INPUTT" />
											</label>
										</div>
										<div class="columns small-12 medium-4 end">
											<label>Password
												<input type="text" v-model="t24pass" placeholder="123456" />
											</label>
										</div>
										<div class="columns small-12 medium-4">
											<label>Company <span class="help-text">(optional)</span>
												<input type="text" v-model="t24company" />
											</label>
										</div>
									</div><!--/.row-->


									<div class="row">
										<div class="columns small-12 medium-3">
											<label>ENQUIRY
												<input type="text" v-model="t24msgid" placeholder="%ACCOUNT" />
											</label>
										</div>
										<div class="columns small-12 medium-9">
											<label>Message Data <span class="help-text">(optional - comma separated values)</span>
												<textarea v-model="t24msgdata" placeholder="@ID:EQ=68907"></textarea>
											</label>
										</div>
									</div><!--/.row-->
								</div><!--/. /v-else-->

								<button type="submit" class="button" v-on:click="generateMsg">Generate OFS Request</button>
								<!-- Added clear button to clear already generated message -->
								<button type="button" class="button secondary" v-on:click="clearForm" style="margin-left:8px">Clear</button>
								<span v-if="iserr" class="label warning">{{message}}</span>
								<span class="label success" v-bind:class="getMessage ? '': 'hide'">OFS Message generated below</span>
							</form>
						</div><!--/.callout-->
					</div>
				</div><!--/.row-->

				<div class="row">
					<div class="columns small-12">
						<div class="callout" id="messageresult">
							<textarea id="clipContent" v-bind:class="{'iserr':iserr, 'highlight': getMessage}" rows=3>{{message}}</textarea>
							<div class="clipBtn button" data-clipboard-action="copy" data-clipboard-target="#clipContent">Click here to copy to Clipboard</div>
						</div><!--/.callout-->
					</div>
				</div><!--/.row-->



				<br/><br/>

				<div class="row">
					<div class="columns small-12 medium-9 medium-centered">
						<h3>OFS REQUEST SYNTAX</h3>
						<label>Transaction Request
							<p class="callout" style="font-weight:bold">
								<span style="color: #186a3b">OPERATION</span>,<span style="color:  #943126 ">OPTIONS</span>,<span style="color: #f5b041 ">USER INFORMATION</span>,<span style="color: #e74c3c ">TRANSACTION ID</span>,<span style="color:#2e86c1">Message Data <i>(comma separated)</i></span>
							</p>
						</label>
						<label>Enquiry Request
							<p class="callout" style="font-weight:bold">
								<span style="color: #186a3b">ENQUIRY.SELECT</span>,<span style="color:  #943126 "></span>,<span style="color: #f5b041 ">USER INFORMATION</span>,<span style="color: #e74c3c">ENQUIRY</span>,<span style="color:#2e86c1">Message Data <i>(comma separated)</i></span>
							</p>
						</label>
					</div>

					<br/>
				</div><!--/.row-->
				<div class="row">
					<div class="columns small-12 medium-9 medium-centered">
						<h3>SPECIAL CHARACTER REPLACEMENTS</h3>
						<table>
							<thead>
								<tr>
									<th>Character</th>
									<th>Symbol</th>
									<th>OFS Replacement</th>
									<th>Description</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>Slash</td>
									<td><code>/</code></td>
									<td><code>^</code></td>
									<td>Used in BATCH &amp; TSA.SERVICE IDs (e.g. BNK/AC.EOD -&gt BNK^AC.EOD)</td>
								</tr>
								<tr>
									<td>Comma</td>
									<td><code>,</code></td>
									<td><code>?</code></td>
									<td>Used in VERSION IDs (e.g. ACCOUNT,CURR -&gt ACCOUNT?CURR)</td>
								</tr>
								<tr>
									<td>Underscore</td>
									<td><code>_</code></td>
									<td><code>'_'</code></td>
									<td>Preserved as literal _ in message data</td>
								</tr>
								<tr>
									<td>Question Mark</td>
									<td><code>?</code></td>
									<td><code>%?%</code></td>
									<td>Preserved as literal ? in message data</td>
								</tr>
								<tr>
									<td>Caret</td>
									<td><code>^</code></td>
									<td><code>%^%</code></td>
									<td>Preserved as literal ^ in message data</td>
								</tr>
								<tr>
									<td>Pipe</td>
									<td><code>|</code></td>
									<td><code>%|%</code></td>
									<td>Preserved as literal | in message data</td>
								</tr>
								<tr>
									<td>Double Quote</td>
									<td><code>"</code></td>
									<td><code>|</code></td>
									<td>Acts as " in message data</td>
								</tr>
							</tbody>
						</table>
						<p class="help-text" style="color: #2e86c1">* Underscore, Question Mark, Caret, Pipe and Double Quote replacements apply only when <strong>Use replacement characters</strong> is set to <strong>Yes</strong>.</p>
					</div>
				</div><!--/.row-->
			</template>

			<template id="reverseOfsTemplate">
				<div class="callout">
					<h1>Reverse OFS Message Viewer</h1>
					<p class="help-text">Paste a generated OFS request to inspect its fields. The original message is never sent anywhere.</p>
					<label>OFS message
						<textarea rows="4" v-model="rawMessage" placeholder="ACCOUNT,P1/I/PROCESS,INPUTT/123456,100724,CUSTOMER=100724,CATEGORY=1001"></textarea>
					</label>
					<button type="button" class="button" v-on:click="loadExample">Load example</button>
					<button type="button" class="button secondary" v-on:click="clearMessage" style="margin-left:8px">Clear</button>
					<span v-if="error" class="label warning" style="margin-left:8px">{{error}}</span>
				</div>

				<div v-if="parsed" class="callout">
					<div class="row">
						<div class="columns small-12 medium-4">
							<h3>Message type</h3>
							<p><span class="label success">{{parsed.type}}</span></p>
						</div>
						<div class="columns small-12 medium-4">
							<label>Application<input type="text" v-model="parsed.application" readonly /></label>
						</div>
						<div class="columns small-12 medium-4">
							<label>{{parsed.type === 'Enquiry request' ? 'Enquiry' : 'Transaction ID'}}<input type="text" v-model="parsed.recordId" readonly /></label>
						</div>
					</div>

					<div class="row">
						<div class="columns small-12 medium-4"><label>Username<input type="text" v-model="parsed.username" readonly /></label></div>
						<div class="columns small-12 medium-4"><label>Password<input type="text" v-model="parsed.password" readonly /></label></div>
						<div class="columns small-12 medium-4"><label>Company<input type="text" v-model="parsed.company" readonly /></label></div>
					</div>

					<div v-if="parsed.type === 'Transaction request'" class="row">
						<div class="columns small-12 medium-3"><label>Version<input type="text" v-model="parsed.version" readonly /></label></div>
						<div class="columns small-12 medium-3"><label>Function<input type="text" v-model="parsed.function" readonly /></label></div>
						<div class="columns small-12 medium-6"><label>GTS control<input type="text" v-model="parsed.gts" readonly /></label></div>
					</div>
					<div v-if="parsed.type === 'Transaction request'" class="row">
						<div class="columns small-12 medium-4"><label>Process or validate<input type="text" v-model="parsed.process" readonly /></label></div>
						<div class="columns small-12 medium-4"><label>No. of auth<input type="text" v-model="parsed.auth" readonly /></label></div>
						<div class="columns small-12 medium-4"><label>Replace existing record<input type="text" v-model="parsed.replace" readonly /></label></div>
					</div>

					<label>Message data<textarea rows="3" v-model="parsed.data" readonly></textarea></label>
					<p class="help-text">Replacement characters: {{parsed.replacementChar}}. Decoded IDs: <code>?</code> becomes <code>,</code> and <code>^</code> becomes <code>/</code>.</p>
				</div>
			</template>
		</div><!--/#app-->
		<script src="./js/clipboard.min.js"></script>
		<script src="./js/main.js"></script>
		<script>
			if (navigator.serviceWorker){
				navigator.serviceWorker.register("./sw.js")
			}
		</script>
	</body>
</html>
